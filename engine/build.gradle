apply plugin: 'com.android.library'

android {
    namespace "com.lody.virtual"
    compileSdk 37
    ndkVersion "27.1.12297006"
    

    defaultConfig {
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            ndkBuild {
                // arm64/x86_64 added: the 2017 tree shipped 32-bit only.
                abiFilters "armeabi-v7a", "arm64-v8a"
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        ndkBuild { path file("src/main/jni/Android.mk") }
    }

    lint { abortOnError false }

    // AGP 8+ turns AIDL off by default; this tree has 47 .aidl files,
    // including the framework interfaces it reimplements.
    buildFeatures { aidl true; prefab true }
}


dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // Built from LSPlant master (see libs/lsplant-commit.txt), not the 6.4
    // release: 6.4 treats an inlined ClassLinker::FixupStaticTrampolines as a
    // fatal init error, and Android 15 inlines it -- no such symbol exists in
    // libart.so under any name. Master explicitly tolerates its absence.
    // The standalone variant is the one to use: "stl": "none", so it coexists
    // with this tree's c++_static, and building it ourselves gets 16 KB page
    // alignment that the Maven prebuilt lacks.
    implementation files('libs/lsplant-standalone.aar')
    // PROBE: inline hooker for LSPlant's InitInfo.inline_hooker.
    implementation 'com.bytedance.android:shadowhook:1.0.10'
}
