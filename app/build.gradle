apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace 'dev.bello.vahost'
    compileSdk 37

    defaultConfig {
        applicationId "dev.bello.vahost"
        minSdk 21
        // 23 on purpose: the lowest Android 14+ will still install. Hidden-API
        // enforcement is keyed to targetSdk, so a low target gives this 2017
        // engine its best chance of booting. Raise it later, deliberately.
        targetSdk 24
        versionCode 1
        versionName "1.0"
        // Both ABIs ship now: the __NR_* syscall wall that blocked arm64 was in
        // IOUniformer, which this port compiles out on 64-bit. A 64-bit device
        // will pick arm64-v8a, so that is the path under test. Note the host
        // process ABI is fixed at install time, and a guest's native libs have
        // to match it -- a 32-bit-only guest needs a 32-bit host.
        ndk { abiFilters "armeabi-v7a", "arm64-v8a" }
    }

    buildTypes { debug { debuggable true; minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    lint { abortOnError false }
    buildFeatures { compose true }
    packaging { jniLibs { useLegacyPackaging = true } }
}

dependencies {
    // Direct module dependency: no more copying an aar between projects,
    // so the engine can never be stale relative to the shell.
    implementation project(':engine')
    // Lifts hidden-API restrictions in every process before the engine resolves
    // its mirrors (needs compileSdk 37).
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.2'

    implementation platform('androidx.compose:compose-bom:2025.08.00')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.core:core-ktx:1.13.1'
}

// The test guest ships inside the shell as an asset, ready for installPackage.
def copyGuestApk = tasks.register('copyGuestApk', Copy) {
    dependsOn ':guest:assembleDebug'
    from(project(':guest').layout.buildDirectory.file('outputs/apk/debug/guest-debug.apk'))
    into file('src/main/assets')
    rename { 'guest.apk' }
}
tasks.named('preBuild') { dependsOn copyGuestApk }
tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }
     .configureEach { dependsOn copyGuestApk }
