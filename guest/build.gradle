apply plugin: 'com.android.application'

android {
    namespace 'dev.bello.container.guest'
    compileSdk 36
    defaultConfig {
        applicationId "dev.bello.container.guest"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }
    buildTypes { debug { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}
// No dependencies on purpose: the guest must not need classes the host lacks.
